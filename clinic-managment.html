<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zaren – Clinic Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F1F5F9; --surface: #ffffff; --surface2: #f1f5f9; --border: #e2e8f0; --border2: #cbd5e1;
      --text: #0f172a; --text-dim: #64748B; --text-mute: #94a3b8;
      --green: #10b981; --green-bg: #ecfdf5; --blue: #2563eb; --blue-bg: #eff6ff; --red: #ef4444; --red-bg: #fef2f2;
      --accent: #4F46E5; --font-mono: 'JetBrains Mono', monospace; --font-sans: 'Inter', sans-serif;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 14px; min-height: 100vh; display: flex; flex-direction: column; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 0 20px; height: 48px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .topbar-left { display: flex; align-items: center; gap: 16px; }
    .logo { font-family: var(--font-mono); font-size: 12px; font-weight: 700; letter-spacing: 0.05em; color: var(--text); text-transform: uppercase; text-decoration: none; }
    .logo span { color: var(--accent); }
    .back-link { font-family: var(--font-mono); font-size: 12px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-dim); text-decoration: none; display: flex; align-items: center; gap: 4px; transition: color 0.2s; }
    .back-link:hover { color: var(--accent); }
    .header { padding: 24px 20px 12px; display: flex; align-items: center; justify-content: space-between; }
    .header-title { font-size: 20px; font-weight: 600; }
    .btn-primary { padding: 10px 20px; background: var(--blue); border: 1px solid var(--blue); color: #fff; font-family: var(--font-mono); font-size: 12px; font-weight: 700; letter-spacing: 0.05em; cursor: pointer; border-radius: 20px; text-transform: uppercase; transition: all 0.2s; }
    .btn-primary:hover { background: #0056b3; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(13, 110, 253, 0.2); }

    .metrics-bar { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .stat-item { display: flex; flex-direction: column; gap: 2px; padding: 10px 16px; background: #fff; border: 1px solid var(--border); border-radius: 8px; min-width: 140px; cursor: default; }
    .stat-label { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-mute); font-weight: 700; }
    .stat-value { font-family: var(--font-sans); font-size: 20px; font-weight: 700; color: var(--text); }
    .stat-value.red { color: var(--red); }
    .stat-value.active { color: var(--blue); }

    .search-area { padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; justify-content: space-between; gap: 40px; }
    .search-input { flex: 1; padding: 10px 16px; border: 1px solid var(--border2); border-radius: 20px; font-size: 13px; outline: none; background: #fff; }
    .search-input:focus { border-color: var(--blue); }

    .content { padding: 0; flex: 1; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead { position: sticky; top: 0; background: var(--surface); z-index: 10; }
    thead th { padding: 12px 16px; text-align: left; font-family: var(--font-mono); font-size: 12px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-mute); border-bottom: 1px solid var(--border); }
    tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
    tbody tr:hover { background: var(--surface); }
    tbody tr.blocked { background: var(--red-bg); }
    tbody td { padding: 10px 16px; vertical-align: middle; }
    .clinic-name { font-weight: 600; color: var(--text); font-size: 15px; }
    .clinic-info { font-size: 13px; color: var(--text-dim); margin-top: 2px; }
    .reason-text { font-size: 10px; color: var(--red); font-weight: 600; text-transform: uppercase; display: block; margin-top: 2px; }
    .actions { display: flex; gap: 8px; justify-content: flex-end; }
    .btn-icon { background: none; border: 1px solid var(--border2); padding: 6px; border-radius: 4px; cursor: pointer; color: var(--text-dim); transition: all 0.2s; }
    .btn-icon:hover { background: var(--surface2); color: var(--text); border-color: var(--text-mute); }
    .btn-icon.delete:hover { color: var(--red); border-color: var(--red); background: var(--red-bg); }

    /* Modal Styles */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(2px); }
    .modal-overlay.open { display: flex; }
    .modal { background: #fff; width: 800px; max-width: 90%; border-radius: 12px; box-shadow: 0 24px 48px rgba(0,0,0,0.25); overflow: hidden; }
    .modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--surface); }
    .modal-title { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.05em; }
    .modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-mute); }
    .modal-body { padding: 32px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .form-group { margin-bottom: 0; }
    .form-group label { display: block; font-family: var(--font-mono); font-size: 12px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-mute); margin-bottom: 8px; }
    .form-control { width: 100%; padding: 12px 14px; border: 1px solid var(--border2); border-radius: 6px; font-size: 14px; outline: none; transition: border-color 0.2s; }
    .form-control:focus { border-color: var(--blue); }
    .modal-footer { padding: 20px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 12px; background: var(--surface); }
    .btn-secondary { padding: 10px 20px; background: var(--surface2); border: 1px solid var(--border2); border-radius: 20px; font-family: var(--font-mono); font-size: 12px; font-weight: 700; letter-spacing: 0.05em; cursor: pointer; text-transform: uppercase; }

    /* Toast */
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #212529; color: #fff; padding: 12px 24px; border-radius: 4px; font-size: 13px; z-index: 1000; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <a href="index.html" class="logo">ZAREN<span>BOARD</span></a>
      <div class="divider-v"></div>
      <a href="index.html" class="back-link">← Back to Board</a>
    </div>
  </div>

  <div class="header">
    <h1 class="header-title">Clinic Management</h1>
  </div>

  <div class="metrics-bar">
    <div class="stat-item">
      <div class="stat-label">Total Clinics</div>
      <div class="stat-value" id="stat-total">0</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Active</div>
      <div class="stat-value active" id="stat-active">0</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Blocked / Inactive</div>
      <div class="stat-value red" id="stat-blocked">0</div>
    </div>
  </div>

  <div class="search-area">
    <input type="text" class="search-input" id="search-input" placeholder="Search clinics by name, ID, or address..." onkeyup="renderClinics()">
    <button class="btn-primary" onclick="openAddModal()">+ Add Clinic</button>
  </div>

  <div class="content">
    <table>
      <thead>
        <tr>
          <th>Clinic Details</th>
          <th>Status</th>
          <th>Contact</th>
          <th>Location</th>
          <th style="text-align: right;">Actions</th>
        </tr>
      </thead>
      <tbody id="clinic-tbody">
        <!-- Rows will be added here -->
      </tbody>
    </table>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal-overlay" id="clinic-modal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modal-title">Add New Clinic</span>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <form id="clinic-form" onsubmit="event.preventDefault(); saveClinic();">
          <input type="hidden" id="clinic-id">
          <div class="form-grid">
            <div class="form-group">
              <label>Clinic Name</label>
              <input type="text" id="clinic-name" class="form-control" required placeholder="e.g. City Health Center">
            </div>
            <div class="form-group">
              <label>Phone / Contact</label>
              <input type="text" id="clinic-contact" class="form-control" required placeholder="e.g. (555) 123-4567">
            </div>
            <div class="form-group" style="grid-column: span 2;">
              <label>Address</label>
              <input type="text" id="clinic-address" class="form-control" required placeholder="e.g. 123 Main St, New York">
            </div>
            <div class="form-group">
              <label>Status</label>
              <select id="clinic-status" class="form-control" onchange="toggleReason()">
                <option value="Active">Active</option>
                <option value="Blocked">Blocked / Inactive</option>
              </select>
            </div>
            <div class="form-group" id="reason-group" style="display: none;">
              <label>Reason for Block</label>
              <input type="text" id="clinic-reason" class="form-control" placeholder="e.g. Licensing issues">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
            <button type="submit" class="btn-primary">Save Clinic</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div id="toast" class="toast">Action completed successfully</div>

  <script>
    let clinics = [
      { id: 1, name: 'Northside General', address: '450 North Ave, Chicago', contact: '(312) 555-0199', status: 'Active', reason: '' },
      { id: 2, name: 'Bayside Medical', address: '1200 Bay St, San Francisco', contact: '(415) 555-0122', status: 'Blocked', reason: 'Unpaid dues' },
      { id: 3, name: 'Downtown Wellness', address: '88 Market St, Seattle', contact: '(206) 555-0344', status: 'Active', reason: '' }
    ];

    function renderClinics() {
      const q = document.getElementById('search-input').value.toLowerCase();
      const tbody = document.getElementById('clinic-tbody');
      const filtered = clinics.filter(c => 
        c.name.toLowerCase().includes(q) || 
        c.address.toLowerCase().includes(q) ||
        `CLN-${c.id.toString().padStart(4, '0')}`.toLowerCase().includes(q)
      );

      tbody.innerHTML = filtered.map(c => `
        <tr class="${c.status === 'Blocked' ? 'blocked' : ''}">
          <td>
            <div class="clinic-name">${c.name}</div>
            <div class="clinic-info">ID: CLN-${c.id.toString().padStart(4, '0')}</div>
          </td>
          <td>
            <div style="display:flex; flex-direction:column; gap:2px;">
              <span style="font-family:var(--font-mono); font-size:10px; font-weight:600; text-transform:uppercase; color:${c.status === 'Active' ? 'var(--green)' : 'var(--red)'}">
                ${c.status === 'Active' ? '● ' : '⚠ '}${c.status}
              </span>
              ${c.status === 'Blocked' ? `<span class="reason-text">${c.reason}</span>` : ''}
            </div>
          </td>
          <td><div class="clinic-info">${c.contact}</div></td>
          <td><div class="clinic-info">${c.address}</div></td>
          <td>
            <div class="actions">
              <button class="btn-icon" onclick="openEditModal(${c.id})">✎</button>
              <button class="btn-icon delete" onclick="deleteClinic(${c.id})">🗑</button>
            </div>
          </td>
        </tr>
      `).join('');

      updateStats();
    }

    function updateStats() {
      document.getElementById('stat-total').textContent = clinics.length;
      document.getElementById('stat-active').textContent = clinics.filter(c => c.status === 'Active').length;
      document.getElementById('stat-blocked').textContent = clinics.filter(c => c.status === 'Blocked').length;
    }

    function toggleReason() {
      const status = document.getElementById('clinic-status').value;
      document.getElementById('reason-group').style.display = status === 'Blocked' ? 'block' : 'none';
    }

    function openAddModal() {
      document.getElementById('modal-title').textContent = 'Add New Clinic';
      document.getElementById('clinic-form').reset();
      document.getElementById('clinic-id').value = '';
      document.getElementById('reason-group').style.display = 'none';
      document.getElementById('clinic-modal').classList.add('open');
    }

    function openEditModal(id) {
      const c = clinics.find(x => x.id === id);
      if (!c) return;
      document.getElementById('modal-title').textContent = 'Edit Clinic';
      document.getElementById('clinic-id').value = c.id;
      document.getElementById('clinic-name').value = c.name;
      document.getElementById('clinic-address').value = c.address;
      document.getElementById('clinic-contact').value = c.contact;
      document.getElementById('clinic-status').value = c.status;
      document.getElementById('clinic-reason').value = c.reason || '';
      toggleReason();
      document.getElementById('clinic-modal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('clinic-modal').classList.remove('open');
    }

    function saveClinic() {
      const id = document.getElementById('clinic-id').value;
      const name = document.getElementById('clinic-name').value;
      const address = document.getElementById('clinic-address').value;
      const contact = document.getElementById('clinic-contact').value;
      const status = document.getElementById('clinic-status').value;
      const reason = status === 'Blocked' ? document.getElementById('clinic-reason').value : '';

      if (id) {
        const idx = clinics.findIndex(x => x.id == id);
        clinics[idx] = { ...clinics[idx], name, address, contact, status, reason };
        showToast('Clinic updated successfully');
      } else {
        const newId = clinics.length > 0 ? Math.max(...clinics.map(x => x.id)) + 1 : 1;
        clinics.push({ id: newId, name, address, contact, status, reason });
        showToast('Clinic added successfully');
      }
      closeModal();
      renderClinics();
    }

    function deleteClinic(id) {
      if (confirm('Are you sure you want to delete this clinic?')) {
        clinics = clinics.filter(x => x.id !== id);
        renderClinics();
        showToast('Clinic deleted');
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    document.getElementById('clinic-modal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    renderClinics();
  </script>
</body>
</html>
