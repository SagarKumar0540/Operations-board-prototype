<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zaren – Technician Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #ffffff; --surface: #f8f9fa; --surface2: #e9ecef; --border: #dee2e6; --border2: #ced4da;
      --text: #212529; --text-dim: #495057; --text-mute: #6c757d;
      --green: #198754; --green-bg: #d1e7dd; --blue: #0d6efd; --blue-bg: #cfe2ff; --red: #dc3545; --red-bg: #f8d7da; --yellow: #ffc107; --yellow-bg: #fff3cd;
      --accent: #0d6efd; --font-mono: 'JetBrains Mono', monospace; --font-sans: 'Inter', sans-serif;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 14px; min-height: 100vh; display: flex; flex-direction: column; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 0 20px; height: 48px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .topbar-left { display: flex; align-items: center; gap: 16px; }
    .logo { font-family: var(--font-mono); font-size: 13px; font-weight: 600; letter-spacing: 0.2em; color: var(--text); text-transform: uppercase; text-decoration: none; }
    .logo span { color: var(--accent); }
    .back-link { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; color: var(--text-mute); text-decoration: none; display: flex; align-items: center; gap: 4px; transition: color 0.2s; }
    .back-link:hover { color: var(--accent); }
    .header { padding: 24px 20px 12px; display: flex; align-items: center; justify-content: space-between; }
    .header-title { font-size: 20px; font-weight: 600; }
    .btn-primary { padding: 10px 20px; background: var(--blue); border: 1px solid var(--blue); color: #fff; font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: 0.05em; cursor: pointer; border-radius: 20px; text-transform: uppercase; transition: all 0.2s; }
    .btn-primary:hover { background: #0056b3; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(13, 110, 253, 0.2); }

    .metrics-bar { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .stat-item { display: flex; flex-direction: column; gap: 2px; padding: 10px 16px; background: #fff; border: 1px solid var(--border); border-radius: 8px; min-width: 140px; cursor: default; }
    .stat-label { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-mute); font-weight: 500; }
    .stat-value { font-family: var(--font-sans); font-size: 20px; font-weight: 700; color: var(--text); }
    .stat-value.red { color: var(--red); }
    .stat-value.green { color: var(--green); }

    .search-area { padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; justify-content: space-between; gap: 40px; }
    .search-input { flex: 1; padding: 10px 16px; border: 1px solid var(--border2); border-radius: 20px; font-size: 13px; outline: none; background: #fff; }
    .search-input:focus { border-color: var(--blue); }

    .content { padding: 0; flex: 1; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead { position: sticky; top: 0; background: var(--surface); z-index: 10; }
    thead th { padding: 12px 16px; text-align: left; font-family: var(--font-mono); font-size: 9px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-mute); border-bottom: 1px solid var(--border); }
    tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
    tbody tr:hover { background: var(--surface); }
    tbody tr.blocked { background: var(--red-bg); }
    tbody td { padding: 10px 16px; vertical-align: middle; }
    .tech-name { font-weight: 600; color: var(--text); font-size: 15px; }
    .tech-info { font-size: 13px; color: var(--text-dim); margin-top: 2px; }
    .reason-text { font-size: 10px; color: var(--red); font-weight: 600; text-transform: uppercase; display: block; margin-top: 2px; }
    .status-badge { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 10px; font-weight: 600; text-transform: uppercase; background: transparent; padding: 0; }
    .status-active { color: var(--green); }
    .status-offline { color: var(--text-mute); }
    .status-blocked { color: var(--red); }
    .load-indicator { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
    .load-bar { flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; max-width: 100px; }
    .load-fill { height: 100%; background: var(--blue); border-radius: 2px; }
    .actions { display: flex; gap: 8px; justify-content: flex-end; }
    .btn-icon { background: none; border: 1px solid var(--border2); padding: 6px; border-radius: 4px; cursor: pointer; color: var(--text-dim); transition: all 0.2s; }
    .btn-icon:hover { background: var(--surface2); color: var(--text); border-color: var(--text-mute); }
    .btn-icon.delete:hover { color: var(--red); border-color: var(--red); background: var(--red-bg); }

    /* Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(2px); }
    .modal-overlay.open { display: flex; }
    .modal { background: #fff; width: 800px; max-width: 90%; border-radius: 12px; box-shadow: 0 24px 48px rgba(0,0,0,0.25); overflow: hidden; }
    .modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--surface); }
    .modal-title { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; font-weight: 600; letter-spacing: 0.1em; }
    .modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-mute); }
    .modal-body { padding: 32px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .form-group { margin-bottom: 0; }
    .form-group label { display: block; font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; color: var(--text-mute); margin-bottom: 8px; }
    .form-control { width: 100%; padding: 12px 14px; border: 1px solid var(--border2); border-radius: 6px; font-size: 14px; outline: none; transition: border-color 0.2s; }
    .form-control:focus { border-color: var(--blue); }
    .modal-footer { padding: 20px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 12px; background: var(--surface); }
    .btn-secondary { padding: 10px 20px; background: var(--surface2); border: 1px solid var(--border2); border-radius: 20px; font-family: var(--font-mono); font-size: 11px; font-weight: 600; cursor: pointer; text-transform: uppercase; }

    /* Toast */
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #212529; color: #fff; padding: 12px 24px; border-radius: 4px; font-size: 13px; z-index: 1000; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    .toast.show { opacity: 1; }

    /* Toast */
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #212529; color: #fff; padding: 12px 24px; border-radius: 4px; font-size: 13px; z-index: 1000; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <a href="refined_operations_board.html" class="logo">ZAREN<span>BOARD</span></a>
      <div style="width: 1px; height: 20px; background: var(--border2);"></div>
      <a href="refined_operations_board.html" class="back-link">← Back to Board</a>
    </div>
  </div>

  <div class="header">
    <h1 class="header-title">Technician Management</h1>
  </div>

  <div class="metrics-bar">
    <div class="stat-item">
      <div class="stat-label">Total Technicians</div>
      <div class="stat-value" id="stat-total">0</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Online</div>
      <div class="stat-value green" id="stat-active">0</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Blocked / Disabled</div>
      <div class="stat-value red" id="stat-blocked">0</div>
    </div>
  </div>

  <div class="search-area">
    <input type="text" class="search-input" id="search-input" placeholder="Search technicians by name or phone..." onkeyup="renderTechs()">
    <button class="btn-primary" onclick="openAddModal()">+ Add Technician</button>
  </div>

  <div class="content">
    <table>
      <thead>
        <tr>
          <th>Technician</th>
          <th>Status</th>
          <th style="text-align: center;">Active Orders</th>
          <th style="text-align: right;">Actions</th>
        </tr>
      </thead>
      <tbody id="tech-tbody">
        <!-- Rows added here -->
      </tbody>
    </table>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal-overlay" id="tech-modal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modal-title">Add New Technician</span>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <form id="tech-form" onsubmit="event.preventDefault(); saveTech();">
          <input type="hidden" id="tech-id">
          <div class="form-grid">
            <div class="form-group">
              <label>Full Name</label>
              <input type="text" id="tech-name" class="form-control" required placeholder="e.g. Mike Taylor">
            </div>
            <div class="form-group">
              <label>Phone Number</label>
              <input type="text" id="tech-phone" class="form-control" required placeholder="e.g. (555) 987-6543">
            </div>
            <div class="form-group">
              <label>Status</label>
              <select id="tech-status" class="form-control" onchange="toggleReason()">
                <option value="Active">Active</option>
                <option value="Offline">Offline</option>
                <option value="Blocked">Blocked / Disabled</option>
              </select>
            </div>
            <div class="form-group" id="reason-group" style="display: none;">
              <label>Reason for Block</label>
              <input type="text" id="tech-reason" class="form-control" placeholder="e.g. Disciplinary action">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
            <button type="submit" class="btn-primary">Save Technician</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div id="toast" class="toast">Action completed successfully</div>

  <script>
    let technicians = [
      { id: 1, name: 'Mike T.', phone: '(555) 012-3456', status: 'Active', load: 2, reason: '' },
      { id: 2, name: 'Sam R.', phone: '(555) 012-7890', status: 'Active', load: 3, reason: '' },
      { id: 3, name: 'John S.', phone: '(555) 012-4455', status: 'Offline', load: 0, reason: '' },
      { id: 4, name: 'Alex W.', phone: '(555) 012-1122', status: 'Blocked', load: 0, reason: 'License expired' }
    ];

    function renderTechs() {
      const q = document.getElementById('search-input').value.toLowerCase();
      const tbody = document.getElementById('tech-tbody');
      const filtered = technicians.filter(t => 
        t.name.toLowerCase().includes(q) || 
        t.phone.toLowerCase().includes(q)
      );

      tbody.innerHTML = filtered.map(t => `
        <tr class="${t.status === 'Blocked' ? 'blocked' : ''}">
          <td>
            <div class="tech-name">${t.name}</div>
            <div class="tech-info">${t.phone}</div>
          </td>
          <td>
            <div style="display:flex; flex-direction:column; gap:2px;">
              <span class="status-badge ${t.status === 'Active' ? 'status-active' : t.status === 'Offline' ? 'status-offline' : 'status-blocked'}">
                ${t.status === 'Active' ? '● ' : t.status === 'Offline' ? '○ ' : '⚠ '}${t.status}
              </span>
              ${t.status === 'Blocked' ? `<span class="reason-text">${t.reason}</span>` : ''}
            </div>
          </td>
          <td style="text-align: center;">
            <div class="tech-info" style="font-weight: 500; color: var(--text); display: flex; justify-content: center;">${t.load}</div>
          </td>
          <td>
            <div class="actions">
              <button class="btn-icon" onclick="openEditModal(${t.id})">✎</button>
              <button class="btn-icon delete" onclick="deleteTech(${t.id})">🗑</button>
            </div>
          </td>
        </tr>
      `).join('');

      updateStats();
    }

    function updateStats() {
      document.getElementById('stat-total').textContent = technicians.length;
      document.getElementById('stat-active').textContent = technicians.filter(t => t.status === 'Active').length;
      document.getElementById('stat-blocked').textContent = technicians.filter(t => t.status === 'Blocked').length;
    }

    function toggleReason() {
      const status = document.getElementById('tech-status').value;
      document.getElementById('reason-group').style.display = status === 'Blocked' ? 'block' : 'none';
    }

    function openAddModal() {
      document.getElementById('modal-title').textContent = 'Add New Technician';
      document.getElementById('tech-form').reset();
      document.getElementById('tech-id').value = '';
      document.getElementById('reason-group').style.display = 'none';
      document.getElementById('tech-modal').classList.add('open');
    }

    function openEditModal(id) {
      const t = technicians.find(x => x.id === id);
      if (!t) return;
      document.getElementById('modal-title').textContent = 'Edit Technician';
      document.getElementById('tech-id').value = t.id;
      document.getElementById('tech-name').value = t.name;
      document.getElementById('tech-phone').value = t.phone;
      document.getElementById('tech-status').value = t.status;
      document.getElementById('tech-reason').value = t.reason || '';
      toggleReason();
      document.getElementById('tech-modal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('tech-modal').classList.remove('open');
    }

    function saveTech() {
      const id = document.getElementById('tech-id').value;
      const name = document.getElementById('tech-name').value;
      const phone = document.getElementById('tech-phone').value;
      const status = document.getElementById('tech-status').value;
      const reason = status === 'Blocked' ? document.getElementById('tech-reason').value : '';

      if (id) {
        const idx = technicians.findIndex(x => x.id == id);
        technicians[idx] = { ...technicians[idx], name, phone, status, reason };
        showToast('Technician updated successfully');
      } else {
        const newId = technicians.length > 0 ? Math.max(...technicians.map(x => x.id)) + 1 : 1;
        technicians.push({ id: newId, name, phone, status, reason, load: 0 });
        showToast('Technician added successfully');
      }
      closeModal();
      renderTechs();
    }

    function deleteTech(id) {
      if (confirm('Are you sure you want to delete this technician?')) {
        technicians = technicians.filter(x => x.id !== id);
        renderTechs();
        showToast('Technician deleted');
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    document.getElementById('tech-modal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    renderTechs();
  </script>
</body>
</html>
