<html>
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zaren – Operations Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/styles_1.css">
  <link rel="stylesheet" href="css/styles_2.css">
  <link rel="stylesheet" href="css/styles_3.css">
  <link rel="stylesheet" href="css/styles_4.css">
  <link rel="stylesheet" href="css/styles_5.css">
</head>

<body>

  <div class="topbar">
    <div class="topbar-left">
      <div class="logo">ZA<span>REN</span></div>
      <div class="divider-v"></div>
      <div class="board-label">Operations Board</div>
    </div>
    <div class="topbar-right">
      <div class="topbar-right-btns">
        <button class="activity-toggle" id="activity-toggle" onclick="toggleActivityPanel()">
          <span class="live-dot"></span> Real-Time Alert
        </button>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="board-panel">
      <div class="stat-bar">
        <div class="stat-item">
          <div class="stat-label">Attention Required</div>
          <div class="stat-value urgent" id="stat-urgent">1</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Active Orders</div>
          <div class="stat-value active" id="stat-active">3</div>
        </div>
      </div>

      <div class="search-bar">
        <input type="text" class="search-input" id="search-input"
          placeholder="Search by patient name, ID, or technician..." onkeyup="handleSearch()" />
        <button class="btn-primary" onclick="location.href='create-order.html'">+ New Order</button>
        <button class="btn-secondary" onclick="location.href='clinic-managment.html'">Clinics</button>
        <button class="btn-secondary" onclick="location.href='technician-managment.html'">Technicians</button>
      </div>

      <div class="filter-bar">
        <span class="filter-label">View</span>
        <button class="filter-btn active" onclick="setFilter(this,'all')">All Orders</button>
        <button class="filter-btn" onclick="setFilter(this,'delayed')">Delayed</button>
        <!-- <button class="filter-btn" onclick="setFilter(this,'stale')">Stale</button> -->
        
        <div class="dropdown-wrap">
          <button class="filter-btn" id="date-filter-btn" onclick="toggleDateDropdown(event)">Sort by Date</button>
          <span class="reset-link hidden" id="reset-date-link" onclick="resetDateFilter()">Reset</span>
          <div class="date-dropdown" id="date-dropdown">
            <div class="dropdown-item" onclick="setDateFilter('today')">
              <input type="radio" name="date-filter" id="date-today">
              <span>Today</span>
            </div>
            <div class="dropdown-item" onclick="setDateFilter('yesterday')">
              <input type="radio" name="date-filter" id="date-yesterday">
              <span>Yesterday</span>
            </div>
            <div class="date-input-wrap">
              <label>Custom Date</label>
              <input type="date" id="custom-date-input" onchange="setDateFilter(this.value)">
            </div>
            <div class="dropdown-item reset" onclick="resetDateFilter()" style="border-top:1px solid var(--border2); margin-top:8px; font-weight:900; color:#ff0000;">Reset Filter</div>
          </div>
        </div>

        <div class="dropdown-wrap">
          <button class="filter-btn" id="tech-filter-btn" onclick="toggleTechDropdown(event)">Technician</button>
          <span class="reset-link hidden" id="reset-tech-link" onclick="resetTechFilter()">Reset</span>
          <div class="tech-dropdown" id="tech-dropdown">
            <!-- Tech items with radios will be injected here -->
            <div class="dropdown-item reset" onclick="resetTechFilter()" style="border-top:1px solid var(--border2); margin-top:8px; font-weight:900; color:#ff0000;">Reset Filter</div>
          </div>
        </div>
        <div class="filter-sep"></div>
      </div>

      <div class="batch-bar" id="batch-bar">
        <span class="batch-count" id="batch-count">0</span> selected
        <button class="batch-btn" onclick="batchReassign()">↺ Reassign</button>
        <button class="batch-btn" onclick="batchMarkCompleteAsk()">✓ Complete</button>
        <button class="batch-btn" onclick="batchAddNote()">✎ Add Note</button>
      </div>

      <div class="table-wrap" id="table-wrap" tabindex="0">
        <table id="order-table">
          <thead>
            <tr>
              <th class="col-checkbox"><input type="checkbox" id="select-all" onclick="toggleSelectAll(this)"></th>
              <th data-sort="patient">Patient / ID</th>
              <th data-sort="state">State</th>
              <th data-sort="tech">Technician</th>
              <th data-sort="datetime" onclick="toggleSort('datetime', true)">Date & Time</th>
              <th data-sort="time">Updated</th>
            </tr>
          </thead>
          <tbody id="order-tbody"></tbody>
        </table>
      </div>
    </div>

    <div class="activity-panel" id="activity-panel">
      <div class="activity-header">
        <span class="activity-title">Real-Time Alerts</span>
        <button class="detail-close" onclick="toggleActivityPanel()">✕</button>
      </div>
      <div class="activity-list" id="activity-list">
        <!-- Activity cards will be injected here -->
      </div>
    </div>

    <div class="detail-panel hidden" id="detail-panel">
      <div class="detail-header">
        <span class="detail-title">Order Details</span>
        <button class="detail-close" onclick="closeDetail()">✕</button>
      </div>
      <div class="detail-body" id="detail-body">
        <div class="empty-panel">
          <div class="empty-panel-icon">◻</div>
          <div class="empty-panel-text">Select an order to view details</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modals -->
  <div class="modal-overlay" id="note-modal">
    <div class="note-modal">
      <div class="tech-modal-header"><span class="tech-modal-title">Add Note</span><button class="detail-close"
          onclick="closeNoteModal()">✕</button></div>
      <div class="note-modal-body">
        <textarea class="note-textarea" id="note-textarea" placeholder="Enter note for this order..."></textarea>
        <div class="note-actions">
          <button onclick="closeNoteModal()">Cancel</button>
          <button class="primary" onclick="saveNote()">Save Note</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="reassign-modal">
    <div class="reassign-modal">
      <div class="reassign-modal-header">
        <span class="reassign-modal-title">Reassign Technician</span>
        <button class="detail-close" onclick="closeReassignModal()">✕</button>
      </div>
      <div class="reassign-options" id="tech-list"></div>
      <div class="note-actions" style="margin-top:0;">
        <button onclick="closeReassignModal()">Cancel</button>
        <button class="primary" onclick="confirmReassign()">Reassign</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="cartoon-modal">
    <div class="cartoon-modal">
      <div class="cartoon-icon">🤖</div>
      <div class="cartoon-message" id="cartoon-message">Are you sure?</div>
      <div class="cartoon-actions">
        <button class="cartoon-btn yes" id="cartoon-yes">Yes</button>
        <button class="cartoon-btn no" onclick="closeCartoonModal()">No</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>
  <!-- <div class="shortcuts-hint">
    <span class="kbd">?</span> Help <span class="kbd">/</span> Search <span class="kbd">ESC</span> Close <span
      class="kbd">↑↓</span> Navigate
  </div> -->

  <script src="js/operations-data.js"></script>
  <script src="js/order_flow_config.js"></script>
  
  <!-- Modular Modules -->
  <script src="js/modules/state-manager.js"></script>
  <script src="js/modules/ui-table.js"></script>
  <script src="js/modules/ui-detail.js"></script>
  <script src="js/modules/ui-filters.js"></script>
  <script src="js/modules/ui-modals.js"></script>
  <script src="js/modules/ui-alerts.js"></script>
  <script src="js/modules/event-listeners.js"></script>
  
  <!-- Entry Point -->
  <script src="js/operations-app.js"></script>
</body>
</html>
